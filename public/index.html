<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Society Function Manager</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#182230;--muted:#667085;--primary:#5b4bdb;--green:#14804a;--red:#c62828;--border:#e6e8ef}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.top{background:linear-gradient(135deg,#4b3cc4,#7667ef);color:#fff;padding:22px 18px 18px;position:sticky;top:0;z-index:5}.top h1{margin:0;font-size:21px}.top p{margin:5px 0 0;opacity:.85;font-size:13px}
.wrap{max-width:980px;margin:auto;padding:16px}.login{max-width:430px;margin:8vh auto;padding:18px}.brand{text-align:center;margin-bottom:24px}.brand .logo{width:68px;height:68px;border-radius:20px;background:linear-gradient(135deg,#4b3cc4,#8b7fff);color:white;display:grid;place-items:center;margin:auto;font-size:30px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 4px 18px rgba(16,24,40,.04)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat b{display:block;font-size:23px;margin-top:7px}.label{font-size:12px;color:var(--muted)}.green{color:var(--green)}.red{color:var(--red)}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:12px;background:#fff;margin-top:6px;margin-bottom:12px;outline:none}textarea{min-height:80px;resize:vertical}
.btn{border:0;border-radius:12px;padding:11px 15px;background:var(--primary);color:white;font-weight:700}.btn.secondary{background:#eef0ff;color:#4336a8}.btn.danger{background:#fff0f0;color:#b42318}.btn.full{width:100%}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 12px}.tab{white-space:nowrap;border:1px solid var(--border);background:white;border-radius:999px;padding:9px 13px;color:#475467}.tab.active{background:#ebe9ff;color:#4336a8;border-color:#d9d5ff;font-weight:700}
.item{padding:13px 0;border-bottom:1px solid var(--border)}.item:last-child{border-bottom:0}.amount{font-weight:800}.pill{font-size:11px;background:#f0f2f5;padding:4px 8px;border-radius:999px;color:#475467}.notice{background:#fff8e7;border:1px solid #f5dfaa}
.small{font-size:12px;color:var(--muted)}h2{font-size:18px;margin:4px 0 12px}h3{font-size:15px;margin:0 0 5px}
.empty{text-align:center;padding:25px;color:var(--muted)}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}

@media print{
  @page{size:A4 portrait;margin:0}
  body{background:#fff!important}
  body *{visibility:hidden!important}
  #printReportRoot,#printReportRoot *{visibility:visible!important}
  #printReportRoot{display:block!important;position:absolute;left:0;top:0;width:100%}
  .report-page{position:relative;width:210mm;min-height:297mm;page-break-after:always;background:#fff;overflow:hidden;padding:47mm 13mm 25mm;box-sizing:border-box}
  .report-page:last-child{page-break-after:auto}
  .report-header{position:absolute;left:0;top:0;width:100%;height:50mm;background-image:var(--report-header);background-size:100% auto;background-repeat:no-repeat;background-position:top center}
  .report-footer{position:absolute;left:0;bottom:0;width:100%;height:34mm;background-image:var(--report-footer);background-size:100% auto;background-repeat:no-repeat;background-position:bottom center}
  .report-content{position:relative;z-index:2}
  .report-title{text-align:center;font-size:21px;font-weight:800;margin:0 0 4px}
  .report-sub{text-align:center;font-size:11px;color:#555;margin-bottom:13px}
  .report-section{font-size:14px;font-weight:800;border-bottom:2px solid #8b1a1a;padding:5px 0;margin:12px 0 7px;color:#7a1111}
  .report-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:7px 0 12px}
  .report-box{border:1px solid #e2d2b3;border-radius:7px;padding:7px;background:#fffaf2}
  .report-box small{display:block;color:#666;font-size:9px}.report-box b{font-size:13px}
  .report-table{width:100%;border-collapse:collapse;font-size:8.5px}
  .report-table th{background:#f6eee2;font-weight:800}
  .report-table th,.report-table td{border:1px solid #dfd5c6;padding:5px;vertical-align:top}
  .report-total td{font-weight:800;background:#faf5ec}
  .report-note{font-size:9px;line-height:1.45}
  .report-sign{text-align:right;margin-top:16px;font-weight:700;font-size:10px}
}
#printReportRoot{display:none}
</style>
</head>
<body>
<div id="loginView" class="login">
  <div class="brand"><div class="logo">🏠</div><h1>Society Function Manager</h1><p>Temporary mobile version</p></div>
  <div class="card">
    <label>Login as</label>
    <select id="role"><option value="organizer">Organizer / Aayojak</option><option value="owner">Flat Owner</option></select>
    <label>Email / Mobile</label><input id="loginId" placeholder="Enter email or mobile">
    <label>Password</label><input id="loginPass" type="password" placeholder="Enter password">
    <button class="btn full" onclick="login()">Login</button>
    <p class="small" style="margin-bottom:0">Demo Organizer: admin@society.local / Admin@123<br>Demo Owner: owner101@society.local / Owner@123</p>
  </div>
</div>

<div id="app" class="hidden">
  <div class="top"><div class="wrap"><div class="row"><div><h1 id="appTitle"></h1><p id="appSub"></p></div><button class="btn secondary" onclick="logout()">Logout</button></div></div></div>
  <main class="wrap" id="content"></main>
</div>

<script>
const KEY="sfm_temp_v1";
const defaultData={
 society:{name:"Saranga Flat & Pramukhpark Society",address:"Ahmedabad, Gujarat"},
 flats:[
  {no:"A-101",name:"Raj Patel",mobile:"9876543210",email:"owner101@society.local"},
  {no:"A-102",name:"Amit Shah",mobile:"9876543211",email:"owner102@society.local"},
  {no:"A-103",name:"Neha Patel",mobile:"9876543212",email:"owner103@society.local"}
 ],
 events:[{id:1,name:"Shree Krishna Janmashtami 2026",date:"04 September 2026",time:"9:00 PM",location:"Saranga Flat & Pramukhpark Society",desc:"Garba, Bhajan and Janmashtami celebration.",status:"Published"}],
 income:[{id:1,eventId:1,date:"04/09/2026",cat:"Donation",desc:"Society contribution",from:"A-101",amount:25000,pay:"UPI"}],
 expenses:[{id:1,eventId:1,date:"04/09/2026",cat:"Decoration",desc:"Decoration work",to:"ABC Decorators",amount:8000,pay:"Cash"}],
 notices:[{id:1,title:"શ્રી કૃષ્ણ જન્માષ્ટમી મહોત્સવ",body:"આજે સાંજે ૯:૦૦ કલાકે ગરબા અને ભજનનું આયોજન કરવામાં આવ્યું છે. સૌ સહપરિવાર પધારશો."}]
};
let data=JSON.parse(localStorage.getItem(KEY)||"null")||defaultData;
let currentRole=null,currentOwner=null,tab="dashboard";
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function money(n){return "₹"+Number(n||0).toLocaleString("en-IN")}
function login(){
 const r=document.getElementById("role").value,id=document.getElementById("loginId").value.trim(),p=document.getElementById("loginPass").value;
 if(r==="organizer"&&id==="admin@society.local"&&p==="Admin@123"){currentRole="organizer";start()}
 else if(r==="owner"&&p==="Owner@123"&&(id==="owner101@society.local"||id==="9876543210")){currentRole="owner";currentOwner=data.flats[0];start()}
 else alert("Invalid login credentials")
}
function start(){document.getElementById("loginView").classList.add("hidden");document.getElementById("app").classList.remove("hidden");tab="dashboard";render()}
function logout(){currentRole=null;document.getElementById("app").classList.add("hidden");document.getElementById("loginView").classList.remove("hidden")}
function render(){
 document.getElementById("appTitle").textContent=currentRole==="organizer"?"Organizer Dashboard":"Flat Owner Dashboard";
 document.getElementById("appSub").textContent=data.society.name;
 document.getElementById("content").innerHTML=currentRole==="organizer"?organizer():owner();
}
function nav(items){return `<div class="tabs">${items.map(([id,t])=>`<button class="tab ${tab===id?"active":""}" onclick="tab='${id}';render()">${t}</button>`).join("")}</div>`}
function organizer(){
 let ti=data.income.reduce((s,x)=>s+Number(x.amount),0),te=data.expenses.reduce((s,x)=>s+Number(x.amount),0);
 let body=tab==="dashboard"?`
 ${nav([["dashboard","Dashboard"],["flats","🏠 Flats"],["events","🎉 Programs"],["income","💰 Income"],["expense","💸 Expenses"],["reports","📊 Reports"],["notices","📢 Notices"]])}
 <div class="grid"><div class="card stat"><span class="label">Total Flats</span><b>${data.flats.length}</b></div><div class="card stat"><span class="label">Programs</span><b>${data.events.length}</b></div><div class="card stat"><span class="label">Total Income</span><b class="green">${money(ti)}</b></div><div class="card stat"><span class="label">Total Expense</span><b class="red">${money(te)}</b></div></div>
 <div class="card"><h2>Current Balance</h2><b style="font-size:30px">${money(ti-te)}</b><p class="small">Financial information is Organizer-only.</p></div>
 <div class="card"><h2>Latest Program</h2>${eventList(data.events.slice(-2).reverse())}</div>`
 :tab==="flats"?`${nav([["dashboard","Dashboard"],["flats","🏠 Flats"],["events","🎉 Programs"],["income","💰 Income"],["expense","💸 Expenses"],["reports","📊 Reports"],["notices","📢 Notices"]])}<div class="card"><h2>Flat Owners</h2><form onsubmit="addFlat(event)"><input id="fno" placeholder="Flat No. e.g. A-104" required><input id="fname" placeholder="Owner Name" required><input id="fmobile" placeholder="Mobile"><input id="femail" placeholder="Email"><button class="btn">+ Add Flat Owner</button></form></div><div class="card">${data.flats.map(f=>`<div class="item"><div class="row"><div><b>${f.no}</b><div>${f.name}</div><span class="small">${f.mobile||""}</span></div><button class="btn danger" onclick="delFlat('${f.no}')">Delete</button></div></div>`).join("")}</div>`
 :tab==="events"?`${nav([["dashboard","Dashboard"],["flats","🏠 Flats"],["events","🎉 Programs"],["income","💰 Income"],["expense","💸 Expenses"],["reports","📊 Reports"],["notices","📢 Notices"]])}<div class="card"><h2>Add Program</h2><form onsubmit="addEvent(event)"><input id="ename" placeholder="Program name" required><input id="edate" placeholder="Date" value="04 September 2026"><input id="etime" placeholder="Time" value="9:00 PM"><input id="eloc" placeholder="Location" value="${data.society.name}"><textarea id="edesc" placeholder="Description"></textarea><button class="btn">+ Add Program</button></form></div><div class="card">${eventList(data.events.slice().reverse())}</div>`
 :tab==="income"?`${nav([["dashboard","Dashboard"],["flats","🏠 Flats"],["events","🎉 Programs"],["income","💰 Income"],["expense","💸 Expenses"],["reports","📊 Reports"],["notices","📢 Notices"]])}<div class="card"><h2>${window.editingIncomeId?"Edit Income":"Add Income"}</h2><form onsubmit="saveIncome(event)"><select id="iEvent">${data.events.map(e=>`<option value="${e.id}" ${window.editingIncomeId&&data.income.find(x=>x.id===window.editingIncomeId)?.eventId===e.id?"selected":""}>${e.name}</option>`).join("")}</select><input id="iDate" placeholder="Date" value="${window.editingIncomeId?(data.income.find(x=>x.id===window.editingIncomeId)?.date||""):""}" required><input id="iCat" placeholder="Category e.g. Donation" value="${window.editingIncomeId?(data.income.find(x=>x.id===window.editingIncomeId)?.cat||""):""}" required><input id="iDesc" placeholder="Description" value="${window.editingIncomeId?(data.income.find(x=>x.id===window.editingIncomeId)?.desc||""):""}"><input id="iFrom" placeholder="Received From" value="${window.editingIncomeId?(data.income.find(x=>x.id===window.editingIncomeId)?.from||""):""}"><input id="iAmount" type="number" min="0" placeholder="Amount ₹" value="${window.editingIncomeId?(data.income.find(x=>x.id===window.editingIncomeId)?.amount||""):""}" required><select id="iPay"><option ${window.editingIncomeId&&data.income.find(x=>x.id===window.editingIncomeId)?.pay==="Cash"?"selected":""}>Cash</option><option ${window.editingIncomeId&&data.income.find(x=>x.id===window.editingIncomeId)?.pay==="UPI"?"selected":""}>UPI</option><option ${window.editingIncomeId&&data.income.find(x=>x.id===window.editingIncomeId)?.pay==="Bank Transfer"?"selected":""}>Bank Transfer</option><option ${window.editingIncomeId&&data.income.find(x=>x.id===window.editingIncomeId)?.pay==="Cheque"?"selected":""}>Cheque</option></select><div class="row"><button class="btn">${window.editingIncomeId?"💾 Update Income":"+ Add Income"}</button>${window.editingIncomeId?'<button type="button" class="btn secondary" onclick="cancelIncomeEdit()">Cancel</button>':''}</div></form></div><div class="card"><div class="row"><h2 style="margin:0">Income Records</h2><b class="green">Total: ${money(data.income.reduce((s,x)=>s+Number(x.amount),0))}</b></div>${data.income.slice().reverse().map(x=>`<div class="item"><div class="row"><div><b>${x.cat}</b><div>${x.desc||""}</div><span class="small">${x.date} • ${x.from||""} • ${x.pay||""}</span></div><span class="amount green">${money(x.amount)}</span></div><div style="margin-top:8px"><button class="btn secondary" onclick="startEditIncome(${x.id})">✏️ Edit</button> <button class="btn danger" onclick="deleteIncome(${x.id})">🗑 Delete</button></div></div>`).join("")||'<div class="empty">No income records.</div>'}</div>`
 :tab==="expense"?`${nav([["dashboard","Dashboard"],["flats","🏠 Flats"],["events","🎉 Programs"],["income","💰 Income"],["expense","💸 Expenses"],["reports","📊 Reports"],["notices","📢 Notices"]])}<div class="card"><h2>Add Expense</h2><form onsubmit="addExpense(event)"><select id="xEvent">${data.events.map(e=>`<option value="${e.id}">${e.name}</option>`).join("")}</select><input id="xDate" placeholder="Date" required><input id="xCat" placeholder="Category e.g. Decoration" required><input id="xDesc" placeholder="Description"><input id="xTo" placeholder="Paid To / Vendor"><input id="xAmount" type="number" min="0" placeholder="Amount ₹" required><select id="xPay"><option>Cash</option><option>UPI</option><option>Bank Transfer</option><option>Cheque</option></select><button class="btn">+ Add Expense</button></form></div><div class="card">${data.expenses.slice().reverse().map(x=>`<div class="item row"><div><b>${x.cat}</b><div>${x.desc||""}</div><span class="small">${x.date} • ${x.to||""}</span></div><span class="amount red">${money(x.amount)}</span></div><div style="margin-top:8px"><button class="btn danger" onclick="deleteExpense(${x.id})">🗑 Delete</button></div></div>`).join("")||'<div class="empty">No expense records.</div>'}</div>`
 :tab==="reports"?`${nav([["dashboard","Dashboard"],["flats","🏠 Flats"],["events","🎉 Programs"],["income","💰 Income"],["expense","💸 Expenses"],["reports","📊 Reports"],["notices","📢 Notices"]])}<div class="card"><h2>Financial Report</h2><p class="small">Organizer-only report</p><div class="grid"><div class="card"><span class="label">Income</span><b class="green">${money(ti)}</b></div><div class="card"><span class="label">Expense</span><b class="red">${money(te)}</b></div><div class="card"><span class="label">Balance</span><b>${money(ti-te)}</b></div><div class="card"><span class="label">Transactions</span><b>${data.income.length+data.expenses.length}</b></div></div><button class="btn" onclick="printReport()">📄 Generate / Save PDF</button></div>${data.events.map(e=>{let inc=data.income.filter(x=>x.eventId===e.id).reduce((s,x)=>s+Number(x.amount),0),exp=data.expenses.filter(x=>x.eventId===e.id).reduce((s,x)=>s+Number(x.amount),0);return `<div class="card"><h3>${e.name}</h3><div class="row"><span>Income ${money(inc)}</span><span>Expense ${money(exp)}</span><b>Balance ${money(inc-exp)}</b></div></div>`}).join("")}`
 :`${nav([["dashboard","Dashboard"],["flats","🏠 Flats"],["events","🎉 Programs"],["income","💰 Income"],["expense","💸 Expenses"],["reports","📊 Reports"],["notices","📢 Notices"]])}<div class="card"><h2>Publish Notice</h2><form onsubmit="addNotice(event)"><input id="ntitle" placeholder="Notice title" required><textarea id="nbody" placeholder="Notice message" required></textarea><button class="btn">Publish Notice</button></form></div><div class="card">${data.notices.slice().reverse().map(n=>`<div class="item"><h3>${n.title}</h3><div>${n.body}</div></div>`).join("")}</div>`;
 return body;
}
function eventList(arr){return arr.map(e=>`<div class="item"><h3>${e.name}</h3><div class="small">📅 ${e.date} • 🕘 ${e.time}<br>📍 ${e.location}</div><p>${e.desc||""}</p></div>`).join("")||'<div class="empty">No programs.</div>'}
function addFlat(e){e.preventDefault();data.flats.push({no:fno.value.trim(),name:fname.value.trim(),mobile:fmobile.value.trim(),email:femail.value.trim()});save();render()}
function delFlat(no){if(confirm("Delete this flat?")){data.flats=data.flats.filter(x=>x.no!==no);save();render()}}
function addEvent(e){e.preventDefault();data.events.push({id:Date.now(),name:ename.value,date:edate.value,time:etime.value,location:eloc.value,desc:edesc.value,status:"Published"});save();render()}
function saveIncome(e){e.preventDefault();const rec={eventId:Number(document.getElementById("iEvent").value),date:document.getElementById("iDate").value,cat:document.getElementById("iCat").value,desc:document.getElementById("iDesc").value,from:document.getElementById("iFrom").value,amount:Number(document.getElementById("iAmount").value),pay:document.getElementById("iPay").value};if(window.editingIncomeId){const i=data.income.findIndex(x=>x.id===window.editingIncomeId);if(i>=0)data.income[i]={...data.income[i],...rec};window.editingIncomeId=null}else{data.income.push({id:Date.now(),...rec})}save();render()}
function startEditIncome(id){window.editingIncomeId=id;tab="income";render()}
function cancelIncomeEdit(){window.editingIncomeId=null;render()}
function deleteIncome(id){if(confirm("Delete this income record?")){data.income=data.income.filter(x=>x.id!==id);if(window.editingIncomeId===id)window.editingIncomeId=null;save();render()}}
function addExpense(e){e.preventDefault();data.expenses.push({id:Date.now(),eventId:Number(xEvent.value),date:xDate.value,cat:xCat.value,desc:xDesc.value,to:xTo.value,amount:Number(xAmount.value),pay:xPay.value});save();render()}
function deleteExpense(id){if(confirm("Delete this expense record?")){data.expenses=data.expenses.filter(x=>x.id!==id);save();render()}}
function addNotice(e){e.preventDefault();data.notices.push({id:Date.now(),title:ntitle.value,body:nbody.value});save();render()}
function owner(){
 return `${nav([["dashboard","🏠 Home"],["events","🎉 Programs"],["notices","📢 Notices"],["profile","👤 My Profile"]])}
 ${tab==="dashboard"?`<div class="card"><h2>Welcome, ${currentOwner.name}</h2><p>Flat ${currentOwner.no}</p></div><div class="card notice"><h3>Latest Notice</h3><p>${data.notices.at(-1)?.body||"No new notices."}</p></div><div class="card"><h2>Upcoming Programs</h2>${eventList(data.events)}</div>`:
 tab==="events"?`<div class="card"><h2>Programs</h2>${eventList(data.events)}</div>`:
 tab==="notices"?`<div class="card"><h2>Notices</h2>${data.notices.slice().reverse().map(n=>`<div class="item"><h3>${n.title}</h3><p>${n.body}</p></div>`).join("")}</div>`:
 `<div class="card"><h2>My Profile</h2><p><b>Name:</b> ${currentOwner.name}</p><p><b>Flat:</b> ${currentOwner.no}</p><p><b>Mobile:</b> ${currentOwner.mobile||"-"}</p><p><b>Email:</b> ${currentOwner.email||"-"}</p></div>`}`;
}
function printReport(){
 let inc=data.income.reduce((s,x)=>s+Number(x.amount),0),exp=data.expenses.reduce((s,x)=>s+Number(x.amount),0);
 const bal=inc-exp;
 const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
 const eventName=id=>(data.events.find(e=>e.id===id)||{}).name||"";
 const incomeRows=data.income.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.date)}</td><td>${esc(eventName(x.eventId))}</td><td>${esc(x.cat)}</td><td>${esc(x.desc)}</td><td>${esc(x.from)}</td><td>${money(x.amount)}</td></tr>`).join("");
 const expenseRows=data.expenses.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.date)}</td><td>${esc(eventName(x.eventId))}</td><td>${esc(x.cat)}</td><td>${esc(x.desc)}</td><td>${esc(x.to)}</td><td>${money(x.amount)}</td></tr>`).join("");
 const eventRows=data.events.map((e,i)=>{
   const ei=data.income.filter(x=>x.eventId===e.id).reduce((s,x)=>s+Number(x.amount),0);
   const ex=data.expenses.filter(x=>x.eventId===e.id).reduce((s,x)=>s+Number(x.amount),0);
