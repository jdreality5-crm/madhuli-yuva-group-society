name: V2 Cloudflare Deploy

on:
  push:
    branches: [fresh-society-v2]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      MASTER_ADMIN_PASSWORD: ${{ secrets.MASTER_ADMIN_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
      FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Recover previously failed payment method migration
        run: |
          set -e
          npx prisma migrate resolve --rolled-back 20260923170000_add_payment_method_to_payment || true
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Generate Prisma client
        run: npm run db:generate:edge
      - name: Build Cloudflare Worker
        run: npm run build:vinext
      - name: Prepare Worker runtime secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MASTER_ADMIN_PASSWORD: ${{ secrets.MASTER_ADMIN_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const keys = [
            'DATABASE_URL',
            'JWT_SECRET',
            'MASTER_ADMIN_PASSWORD',
            'SUPABASE_URL',
            'SUPABASE_SERVICE_ROLE_KEY',
            'SUPABASE_STORAGE_BUCKET',
            'FIREBASE_WEB_API_KEY',
            'RESEND_API_KEY',
            'EMAIL_FROM',
          ];
          const secrets = Object.fromEntries(keys.map((key) => [key, process.env[key] || '']));
          fs.writeFileSync('/tmp/worker-secrets.json', JSON.stringify(secrets));
          NODE
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: v2
          wranglerVersion: "4"
          command: deploy --secrets-file /tmp/worker-secrets.json
      - name: Smoke test signup residences
        run: |
          set -e
          response="$(curl --silent --show-error --fail-with-body --max-time 30 https://society-function-management-v2.jdreality5.workers.dev/api/auth/residences)"
          node -e 'const d=JSON.parse(process.argv[1]); if (!Array.isArray(d.properties)) throw new Error("Signup residences response missing properties array"); const units=d.properties.reduce((n,p)=>n+(Array.isArray(p.units)?p.units.length:0),0); if (!d.properties.length || !units) console.warn("Signup residences smoke test warning: no eligible signup residences currently available"); console.log("Signup residences endpoint passed:", d.properties.length, "properties,", units, "units");' "$response"
