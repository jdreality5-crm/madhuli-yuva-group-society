name: V2 Build Check
on:
  push:
    branches: [fresh-society-v2]
  pull_request:
    branches: [fresh-society-v2]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm audit --json > npm-audit.json || true
      - run: node -e "const a=require('./npm-audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities||{})) console.log(name+' | '+v.severity+' | '+(v.via||[]).map(x=>typeof x==='string'?x:x.title||x.url||'advisory').join(', '))"
      - run: npx prisma generate
      - run: npx next build
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build?schema=public
          JWT_SECRET: ci-build-secret-change-in-production
